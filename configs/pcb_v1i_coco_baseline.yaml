# Baseline dataset config for the cleaned PCB-Defect-Detection.v1i Roboflow COCO export.
# Category id 0 exists in the JSON category list as a parent label, but the
# actual annotations use the six defect classes listed below.

dataset_name: pcb_v1i_coco_baseline
format: coco_detection
dataset_root: data/resources/PCB-Defect-Detection.v1i.coco

splits:
  train:
    images_dir: data/resources/PCB-Defect-Detection.v1i.coco/train
    annotations: data/resources/PCB-Defect-Detection.v1i.coco/train/_annotations.coco.json
  val:
    images_dir: data/resources/PCB-Defect-Detection.v1i.coco/valid
    annotations: data/resources/PCB-Defect-Detection.v1i.coco/valid/_annotations.coco.json
  test:
    images_dir: data/resources/PCB-Defect-Detection.v1i.coco/test
    annotations: data/resources/PCB-Defect-Detection.v1i.coco/test/_annotations.coco.json

class_names:
  - missing_hole
  - mouse_bite
  - open_circuit
  - short
  - spur
  - spurious_copper

source_category_ids:
  missing_hole: 1
  mouse_bite: 2
  open_circuit: 3
  short: 4
  spur: 5
  spurious_copper: 6
